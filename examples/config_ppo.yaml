# PPO on sumo-1. Defaults suit a single modern CUDA GPU; lower env.num_envs first
# if you run out of memory.
#
# A yaml value of `null` under env.arena / env.reward_weights / env.termination
# means "keep whatever the registry chose", so a run can change one knob without
# restating everything else.

# Optional warm start from an existing policy, and the checkpoints/ subdirectory
# this run writes to. There is no `level`: see examples/ppo_sumo.py.
init_checkpoint: null
# Load the checkpoint's critic too. Set false when the reward has changed scale
# since that checkpoint was trained: a critic fitted to a different return
# distribution makes GAE worse than a fresh one, not merely noisier.
init_critic: true
run_name: sumo1

env:
  name: sumo-1
  robot: g1
  num_envs: 2048          # parallel DUELS. Under self-play the policy batch is 2x this.
  seed: 0
  # Per-world MuJoCo-Warp buffers. Two humanoids in a clinch are far more
  # contact-rich than the quadruped these numbers were first tuned for, and
  # MuJoCo-Warp DROPS constraints past the cap instead of raising, so a too-small
  # value shows up as a duel that mysteriously refuses to make contact.
  # tools/warp_smoke.py reports the observed peak; keep headroom over it.
  nconmax: 160
  njmax: 600

  arena:
    # opponent: "self" is the real game; "zero" is a passive dummy, only for
    # bootstrapping standing on a fresh robot.
    opponent: null
    ring_radius: null
    platform_height: null
    spawn_frac: null
    action_scale: null
    frame_skip: null
    push_interval_steps: null
    push_speed: null
    pos_noise: null
    yaw_noise: null
    joint_noise: null


  reward_weights:
    # Whole-episode values, so each reads directly against `win`. See RewardConfig.
    win: null
    push: null
    alive: null
    centre: null
    action: null
    joint_vel: null


  termination:
    fall_height_frac: null
    max_tilt_deg: null
    max_episode_steps: null

collector:
  frames_per_batch: 65536   # policy rows per PPO batch; rounded down to a whole
                            # number of env steps against the real batch size.
  total_frames: 20_000_000

loss:
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coeff: 0.005
  critic_coeff: 0.5
  loss_critic_type: l2
  ppo_epochs: 4
  mini_batch_size: 8192
  max_grad_norm: 1.0
  anneal_lr: true
  anneal_clip_epsilon: true

optim:
  lr: 3.0e-4

network:
  device: cuda:0
  activation: elu
  hidden_sizes: [512, 256, 128]
  # Soft bound on the pre-squash mean, applied as max_loc * tanh(loc / max_loc).
  # tanh(3) is already 0.995, so nothing past ~3 commands additional motion, and
  # an unbounded mean is what let a stored log-prob reach 3427 and overflow the
  # importance ratio. Measured on a healthy 290M checkpoint: median |loc| 0.36,
  # 99th percentile 2.07, max 3.62, so 5 leaves the working range untouched.
  # tools/policy_saturation.py measures this on a checkpoint.
  max_loc: 5.0

logger:
  backend: wandb          # "" disables logging entirely
  mode: online
  project_name: automataleague-sumo
  group_name: sumo-1
  exp_name: sumo1
  eval_iter: 1_000_000    # collected frames between evaluations
  eval_envs: 64           # duels per evaluation
  eval_steps: 750         # cap; equals one full episode at the default termination


hydra:
  job:
    chdir: false
